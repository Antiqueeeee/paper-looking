[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperbase"
version = "0.1.0"
description = "Personal paper library: scheduled collection, translation, reading and DCI-based AI Q&A"
readme = "docs/BDD.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "APScheduler>=3.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["paperbase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
