<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PaperBase · 个人论文库</title>
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--primary:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;background:#0f172a;color:#fff;padding:.55rem .75rem;padding-top:calc(.55rem + env(safe-area-inset-top))}
header h1{font-size:1rem;margin:0 0 .45rem;font-weight:700}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}
nav button{background:#1e293b;color:#cbd5e1;border:1px solid #334155;padding:.55rem .1rem;border-radius:10px;cursor:pointer;font-size:.82rem;min-height:44px;white-space:nowrap}
nav button.active,nav button:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
main{max-width:1100px;margin:0 auto;padding:.75rem}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:.9rem;margin-bottom:.8rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:.65rem;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:16px}
textarea{resize:vertical}
button.btn{background:var(--primary);color:#fff;border:0;padding:.65rem 1rem;border-radius:10px;cursor:pointer;font-weight:600;min-height:44px}
button.ghost{background:#eef2ff;color:var(--primary);border:1px solid #c7d2fe;min-height:44px}
pre{background:#0f172a;color:#e2e8f0;padding:.75rem;border-radius:10px;overflow:auto;white-space:pre-wrap;font-size:.84rem;max-width:100%}
pre.light{background:#f8fafc;color:#1e293b;border:1px solid var(--border);white-space:pre-wrap}
.paper{border-bottom:1px solid var(--border);padding:.85rem 0}
.paper:last-child{border-bottom:0}
.paper h3{margin:.1rem 0;font-size:1.02rem}
.paper h3 a{color:var(--text);text-decoration:none}
.paper h3 a:hover{color:var(--primary)}
.paper .zh{color:var(--muted);font-size:.9rem;margin:.2rem 0}
.paper .meta{font-size:.78rem;color:var(--muted)}
.badges span{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:99px;padding:.1rem .55rem;font-size:.75rem;margin:.15rem .25rem 0 0}
.badges .st{background:#f0fdf4;color:var(--ok)}.badges .st.warn{background:#fffbeb;color:var(--warn)}
.cite a{display:inline-block;color:#2563eb;text-decoration:none;margin:.2rem .4rem .2rem 0;font-size:.85rem}
.muted{color:var(--muted);font-size:.88rem}
.hint{color:var(--muted);font-size:.82rem}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:480px}td,th{border:1px solid var(--border);padding:.4rem .55rem;font-size:.85rem;text-align:left}
.actions{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap}
.actions .btn,.actions .ghost{flex:1;min-width:110px;text-align:center}
#toast{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:.6rem 1rem;border-radius:99px;display:none;max-width:88vw;font-size:.9rem}
@media (max-width:640px){
  main{padding:.5rem}
  .card{padding:.75rem;border-radius:12px}
  .row>*{flex:1 1 100%;min-width:0}
  .actions .btn,.actions .ghost{flex:1 1 100%}
  h2{font-size:1.1rem}
  .paper .meta{line-height:1.5}
}
</style>
</head>
<body>
<header>
  <h1>📚 PaperBase</h1>
  <nav>
    <button class="active" onclick="show('digest')">今日早报</button>
    <button onclick="show('papers')">论文库</button>
    <button onclick="show('upload')">上传</button>
    <button onclick="show('stats')">统计</button>
  </nav>
</header>
<main>
  <section id="digest" class="view active">
    <div class="card">
      <div class="row"><h2 style="margin:0;flex:1">今日早报</h2><button class="btn" onclick="loadDigest()">刷新早报</button><a href="/digest" target="_blank"><button class="ghost">网页版早报</button></a></div>
      <p class="hint">每周一 02:00 自动抓取，03:00 前生成。也可以在服务器执行 <code>paper today</code>。</p>
      <pre id="digestText" class="light">加载中…</pre>
    </div>
  </section>

  <section id="papers" class="view">
    <div class="card">
      <div class="row">
        <input id="q" placeholder="标题 / 摘要关键词">
        <select id="tag"><option value="">全部标签</option></select>
        <select id="year"><option value="">全部年份</option></select>
        <select id="source"><option value="">全部来源</option></select>
        <select id="status"><option value="">全部状态</option><option value="new">新收录</option><option value="in_queue">待读队列</option><option value="reading">在读</option><option value="done">已读</option><option value="later">稍后</option></select>
      </div>
      <div class="actions"><button class="btn" onclick="searchPapers()">搜索</button><button class="ghost" onclick="searchPapers()">刷新</button></div>
      <p class="hint" id="searchMeta"></p>
      <div id="paperList"></div>
    </div>
  </section>

  <section id="upload" class="view">
    <div class="card">
      <h2>上传 PDF</h2>
      <input type="file" id="pdfFile" accept="application/pdf"><br><br>
      <input id="uploadPaperId" placeholder="已有论文 ID（可选，留空自动匹配/新建）">
      <input id="uploadTitle" placeholder="论文标题（新建记录时使用，可选）"><br><br>
      <button class="btn" onclick="uploadPdf()">上传并加入解析队列</button>
      <pre id="uploadResult" class="light" style="display:none"></pre>
    </div>
  </section>

  <section id="stats" class="view">
    <div class="card"><h2>库统计</h2><div id="statsBox" class="muted">加载中…</div></div>
  </section>
</main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
function show(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active', b.textContent.trim()===({
    digest:'今日早报',papers:'论文库',upload:'上传',stats:'统计'}[name])));
  $(name).classList.add('active');
  if(name==='digest')loadDigest();
  if(name==='papers'){loadFacets();searchPapers();}
  if(name==='stats')loadStats();
}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
async function j(url,opts={}){const r=await fetch(url,opts);if(!r.ok){const e=await r.text();throw new Error(e||r.status)}return r.json()}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function loadDigest(){
  try{const d=await j('/api/digest/today');$('digestText').textContent=d.content}
  catch(e){$('digestText').textContent='暂无早报。先在服务器运行：paper today'}
}
let TAG_LABELS={},SOURCE_LABELS={},STATUS_LABELS={'new':'新收录','in_queue':'待读队列','reading':'在读','done':'已读','later':'稍后'};
function label(t,map){return map[t]||t}
async function loadFacets(){
  try{
    const d=await j('/api/facets');
    TAG_LABELS={}; (d.tags||[]).forEach(t=>TAG_LABELS[t.value]=t.label);
    SOURCE_LABELS={}; (d.sources||[]).forEach(s=>SOURCE_LABELS[s.value]=s.label);
    for(const [id,vals] of [['tag',d.tags],['year',d.years],['source',d.sources]]){
      const sel=$(id); const cur=sel.value;
      sel.innerHTML=`<option value="">${id==='tag'?'全部标签':id==='year'?'全部年份':'全部来源'}</option>`+(vals||[]).map(v=>`<option value="${esc(v.value)}">${esc(v.label)}</option>`).join('');
      sel.value=cur;
    }
  }catch(e){}
}
async function searchPapers(){
  const p=new URLSearchParams({q:$('q').value.trim(),tag:$('tag').value.trim(),year:$('year').value.trim(),source:$('source').value.trim(),status:$('status').value,limit:'50'});
  try{
    const d=await j('/api/papers?'+p);
    $('searchMeta').textContent=`共 ${d.total} 篇，显示 ${d.items.length} 篇`;
    $('paperList').innerHTML=d.items.map(x=>`
      <div class="paper">
        <h3><a href="/reader/${encodeURIComponent(x.id)}">${esc(x.title)}</a></h3>
        ${x.title_zh?`<div class="zh">${esc(x.title_zh)}</div>`:''}
        <div class="meta">[${x.year||'?'}] ${esc(x.venue||'-')} · ${esc(label(x.source,SOURCE_LABELS))} · PDF:${esc(label(x.pdf_status,{'none':'无','needs_upload':'待上传','downloaded':'已下载','download_failed':'下载失败','cold':'冷存储'}))} · 解析:${esc(label(x.parse_status,{'none':'未解析','done':'已解析','failed':'失败'}))} · 翻译:${esc(label(x.translate_status,{'none':'未翻译','done':'已翻译','failed':'失败'}))}</div>
        <div class="badges">${(x.tags||[]).map(t=>`<span>${esc(label(t,TAG_LABELS))}</span>`).join('')}<span class="st">${esc(label(x.status,STATUS_LABELS))}</span></div>
        <div class="actions">
          <a href="/reader/${encodeURIComponent(x.id)}?ask=1#ask"><button class="btn">阅读 &amp; 提问</button></a>
          <a href="/reader/${encodeURIComponent(x.id)}?lang=zh"><button class="ghost">中文阅读</button></a>
          <button class="ghost" onclick="queueOne('${esc(x.id)}')">加入队列</button>
        </div>
      </div>`).join('') || '<p class="muted">没有结果</p>';
  }catch(e){toast('搜索失败：'+e.message)}
}
async function queueOne(id){try{const d=await j('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[id]})});toast('已加入队列')}catch(e){toast(e.message)}}
async function uploadPdf(){
  const f=$('pdfFile').files[0];if(!f){toast('请选择 PDF');return}
  const fd=new FormData();fd.append('file',f);
  if($('uploadPaperId').value.trim())fd.append('paper_id',$('uploadPaperId').value.trim());
  if($('uploadTitle').value.trim())fd.append('title',$('uploadTitle').value.trim());
  try{const d=await j('/api/upload',{method:'POST',body:fd});$('uploadResult').style.display='block';$('uploadResult').textContent=JSON.stringify(d,null,2);toast('上传成功：'+d.id)}catch(e){toast('上传失败：'+e.message)}
}
async function loadStats(){
  try{const d=await j('/api/stats');const rows=o=>Object.entries(o||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('');
    const table=(title,obj)=>`<h4>${title}</h4><div class="table-wrap"><table>${rows(obj)}</table></div>`;
    $('statsBox').innerHTML=`<h3>总数：${d.papers}</h3>
      ${table('来源',d.by_source)}
      ${table('年份',d.by_year)}
      ${table('阅读状态',d.by_status)}
      ${table('PDF 状态',d.by_pdf_status)}
      ${table('解析状态',d.by_parse_status)}
      ${table('标签',d.by_tag)}`}
  catch(e){$('statsBox').textContent=e.message}
}
loadDigest();
</script>
</body></html>
