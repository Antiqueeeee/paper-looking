<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>PaperBase · 个人论文库</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">📚 PaperBase</div>
  <nav>
    <button class="active" onclick="show('digest')">今日早报</button>
    <button onclick="show('papers')">论文库</button>
    <button onclick="show('queue')">阅读队列</button>
    <button onclick="show('upload')">上传</button>
    <button onclick="show('stats')">统计</button>
  </nav>
</header>
<main class="container">
  <section id="digest" class="view active">
    <div class="card">
      <div class="row"><h2 style="margin:0;flex:1">今日早报</h2><button class="btn" onclick="loadDigest()">刷新早报</button><a href="/digest" target="_blank"><button class="ghost">网页版早报</button></a></div>
      <p class="hint">每周一 02:00 自动抓取，03:00 前生成。也可以在服务器执行 <code>paper today</code>。</p>
      <pre id="digestText" class="light">加载中…</pre>
    </div>
  </section>

  <section id="papers" class="view">
    <div class="card">
      <div class="row">
        <input id="q" placeholder="标题 / 摘要关键词">
        <select id="tag"><option value="">全部标签</option></select>
        <select id="year"><option value="">全部年份</option></select>
        <select id="source"><option value="">全部来源</option></select>
        <select id="status"><option value="">全部状态</option><option value="new">新收录</option><option value="in_queue">待读队列</option><option value="reading">在读</option><option value="done">已读</option><option value="later">稍后</option></select>
      </div>
      <div class="actions"><button class="btn" onclick="searchPapers()">搜索</button><button class="ghost" onclick="searchPapers()">刷新</button></div>
      <p class="hint">说明：“想读这篇”会加入阅读队列，系统随后自动下载 PDF（如可获取）、解析并翻译全文。</p>
      <p class="hint" id="searchMeta"></p>
      <div id="paperList"></div>
    </div>
  </section>

  <section id="queue" class="view">
    <div class="card">
      <div class="row"><h2 style="margin:0;flex:1">阅读队列</h2><button class="btn" onclick="loadQueue()">刷新进度</button></div>
      <p class="hint">这里显示你点过“想读”的论文。系统会自动下载、解析、翻译；完成后可直接阅读和提问。</p>
      <div id="queueList"></div>
    </div>
  </section>

  <section id="upload" class="view">
    <div class="card">
      <h2>上传 PDF</h2>
      <input type="file" id="pdfFile" accept="application/pdf"><br><br>
      <input id="uploadTitle" placeholder="论文标题（推荐）">
      <input id="uploadDoi" placeholder="DOI，例如 10.1145/xxxxxxx（可选）">
      <input id="uploadVenue" placeholder="期刊 / 会议名称（可选）">
      <input id="uploadIssn" placeholder="ISSN（可选）">
      <input id="uploadYear" placeholder="年份，例如 2026（可选）">
      <input id="uploadAuthors" placeholder="作者，多个用逗号分隔（可选）">
      <input id="uploadTags" placeholder="标签，多个用逗号分隔，例如 rag,kbqa（可选）">
      <input id="uploadPaperId" placeholder="已有论文 ID（通常留空，系统按 DOI/标题自动匹配）"><br><br>
      <button class="btn" onclick="uploadPdf()">上传并加入解析队列</button>
      <pre id="uploadResult" class="light" style="display:none"></pre>
    </div>
  </section>

  <section id="stats" class="view">
    <div class="card"><h2>库统计</h2><div id="statsBox" class="muted">加载中…</div></div>
  </section>
</main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
function show(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active', b.textContent.trim()===({
    digest:'今日早报',papers:'论文库',queue:'阅读队列',upload:'上传',stats:'统计'}[name])));
  $(name).classList.add('active');
  if(name==='digest')loadDigest();
  if(name==='papers'){loadFacets();searchPapers();}
  if(name==='queue')loadQueue();
  if(name==='stats')loadStats();
}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
async function j(url,opts={}){const r=await fetch(url,opts);if(!r.ok){const e=await r.text();throw new Error(e||r.status)}return r.json()}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function loadDigest(){
  try{const d=await j('/api/digest/today');$('digestText').textContent=d.content}
  catch(e){$('digestText').textContent='暂无早报。先在服务器运行：paper today'}
}
let TAG_LABELS={},SOURCE_LABELS={},STATUS_LABELS={'new':'新收录','in_queue':'待读队列','reading':'在读','done':'已读','later':'稍后'};
function label(t,map){return map[t]||t}
async function loadFacets(){
  try{
    const d=await j('/api/facets');
    TAG_LABELS={}; (d.tags||[]).forEach(t=>TAG_LABELS[t.value]=t.label);
    SOURCE_LABELS={}; (d.sources||[]).forEach(s=>SOURCE_LABELS[s.value]=s.label);
    for(const [id,vals] of [['tag',d.tags],['year',d.years],['source',d.sources]]){
      const sel=$(id); const cur=sel.value;
      sel.innerHTML=`<option value="">${id==='tag'?'全部标签':id==='year'?'全部年份':'全部来源'}</option>`+(vals||[]).map(v=>`<option value="${esc(v.value)}">${esc(v.label)}</option>`).join('');
      sel.value=cur;
    }
  }catch(e){}
}
async function searchPapers(){
  const p=new URLSearchParams({q:$('q').value.trim(),tag:$('tag').value.trim(),year:$('year').value.trim(),source:$('source').value.trim(),status:$('status').value,limit:'50'});
  try{
    const d=await j('/api/papers?'+p);
    $('searchMeta').textContent=`共 ${d.total} 篇，显示 ${d.items.length} 篇`;
    $('paperList').innerHTML=d.items.map(x=>{
      const zh=x.title_zh||'';
      const parsed=x.parse_status==='done';
      const translated=x.translate_status==='done' && x.md_zh_path;
      let actions='';
      if(parsed){
        actions=`<a href="/reader/${encodeURIComponent(x.id)}?ask=1#ask"><button class="btn">英文阅读 + 提问</button></a>`;
        actions+= translated
          ? `<a href="/reader/${encodeURIComponent(x.id)}?lang=zh"><button class="ghost">中文阅读</button></a>`
          : `<button class="ghost" disabled>中文待翻译</button>`;
      }else{
        actions=`<button class="btn" onclick="queueOne('${esc(x.id)}')">想读：自动解析+翻译</button>`;
        if(x.pdf_status==='needs_upload') actions+=`<button class="ghost" onclick="show('upload')">去上传 PDF</button>`;
      }
      return `
      <div class="paper">
        <h3><a href="/reader/${encodeURIComponent(x.id)}">${esc(zh||x.title)}</a></h3>
        ${zh?`<div class="zh">${esc(x.title)}</div>`:''}
        <div class="meta">[${x.year||'?'}] ${esc(x.venue||'-')} · ${esc(label(x.source,SOURCE_LABELS))} · PDF:${esc(label(x.pdf_status,{'none':'无','needs_upload':'待上传','downloaded':'已下载','download_failed':'下载失败','cold':'冷存储'}))} · 解析:${esc(label(x.parse_status,{'none':'未解析','done':'已解析','failed':'失败'}))} · 翻译:${esc(label(x.translate_status,{'none':'未翻译','done':'已翻译','failed':'失败'}))}</div>
        <div class="badges">${(x.tags||[]).map(t=>`<span>${esc(label(t,TAG_LABELS))}</span>`).join('')}<span class="st">${esc(label(x.status,STATUS_LABELS))}</span></div>
        <div class="actions">${actions}</div>
      </div>`}).join('') || '<p class="muted">没有结果</p>';
  }catch(e){toast('搜索失败：'+e.message)}
}
async function queueOne(id){
  try{
    const d=await j('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[id]})});
    toast('已加入阅读队列');
    setTimeout(()=>show('queue'),500);
  }catch(e){toast(e.message)}
}
async function uploadPdf(){
  const f=$('pdfFile').files[0];if(!f){toast('请选择 PDF');return}
  const fd=new FormData();fd.append('file',f);
  if($('uploadPaperId').value.trim())fd.append('paper_id',$('uploadPaperId').value.trim());
  if($('uploadTitle').value.trim())fd.append('title',$('uploadTitle').value.trim());
  if($('uploadDoi').value.trim())fd.append('doi',$('uploadDoi').value.trim());
  if($('uploadVenue').value.trim())fd.append('venue',$('uploadVenue').value.trim());
  if($('uploadIssn').value.trim())fd.append('issn',$('uploadIssn').value.trim());
  if($('uploadYear').value.trim())fd.append('year',$('uploadYear').value.trim());
  if($('uploadAuthors').value.trim())fd.append('authors',$('uploadAuthors').value.trim());
  if($('uploadTags').value.trim())fd.append('tags',$('uploadTags').value.trim());
  try{const d=await j('/api/upload',{method:'POST',body:fd});$('uploadResult').style.display='block';$('uploadResult').textContent=JSON.stringify(d,null,2);toast('上传成功：'+d.id)}catch(e){toast('上传失败：'+e.message)}
}
const TASK_LABELS={'download_pdf':'下载PDF','parse_pdf':'解析PDF','translate_full':'全文翻译','translate_meta':'摘要翻译'};
const TASK_STATE={'queued':'排队中','running':'处理中','done':'已完成','failed':'失败'};
function progressOf(p){
  const rows=[];
  for(const [task,label] of Object.entries(TASK_LABELS)){
    const st=p.tasks[task]||'-';
    rows.push(`${label}:${st==='-'?'未开始':(TASK_STATE[st]||st)}`);
  }
  return rows.join(' · ');
}
async function loadQueue(){
  try{
    const d=await j('/api/queue');
    $('queueList').innerHTML=d.items.map(p=>{
      const zh=p.title_zh||'';
      const readable=p.parse_status==='done';
      return `
      <div class="paper">
        <h3>${esc(zh||p.title)}</h3>
        ${zh?`<div class="zh">${esc(p.title)}</div>`:''}
        <div class="meta">[${p.year||'?'}] ${esc(p.venue||'-')} · ${esc(label(p.source,SOURCE_LABELS))}</div>
        <div class="meta">进度：${esc(progressOf(p))}</div>
        <div class="badges"><span class="st">${esc(label(p.status,STATUS_LABELS))}</span></div>
        <div class="actions">
          ${readable?`<a href="/reader/${encodeURIComponent(p.id)}?ask=1#ask"><button class="btn">阅读 &amp; 提问</button></a>`:`<button class="btn" disabled>等待解析</button>`}
          ${p.pdf_status==='needs_upload'?`<button class="ghost" onclick="show('upload')">去上传 PDF</button>`:''}
        </div>
      </div>`}).join('') || '<p class="muted">阅读队列是空的。去论文库点“想读：自动解析+翻译”。</p>';
  }catch(e){$('queueList').innerHTML='加载失败：'+esc(e.message)}
}
async function loadStats(){
  try{const d=await j('/api/stats');const rows=o=>Object.entries(o||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('');
    const table=(title,obj)=>`<h4>${title}</h4><div class="table-wrap"><table>${rows(obj)}</table></div>`;
    $('statsBox').innerHTML=`<h3>总数：${d.papers}</h3>
      ${table('来源',d.by_source)}
      ${table('年份',d.by_year)}
      ${table('阅读状态',d.by_status)}
      ${table('PDF 状态',d.by_pdf_status)}
      ${table('解析状态',d.by_parse_status)}
      ${table('标签',d.by_tag)}`}
  catch(e){$('statsBox').textContent=e.message}
}
loadDigest();
</script>
</body></html>
